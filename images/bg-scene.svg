<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 暖米黄纸质感底色 -->
  <rect width="1920" height="1080" fill="#f3ecd9"/>
  <rect width="1920" height="1080" fill="#f7f0df"/>

  <!-- 细腻纸张颗粒 -->
  <rect width="1920" height="1080" filter="url(#paper-grain)" opacity="0.45"/>

  <!-- 暗角 -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="50%" stop-color="#1a1410" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a1410" stop-opacity="0.28"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- 背景扶梯/地铁结构线条 -->
  <g stroke="#2a2520" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.18">
    <!-- 主扶梯扶手 -->
    <path d="M0 880 L1920 320"/>
    <path d="M0 950 L1920 390"/>
    <!-- 斜向结构梁 -->
    <path d="M300 1080 L900 200"/>
    <path d="M650 1080 L1250 200"/>
    <path d="M1000 1080 L1600 200"/>
    <path d="M1350 1080 L1920 260"/>
    <!-- 垂直支撑柱 -->
    <line x1="520" y1="0" x2="520" y2="1080"/>
    <line x1="860" y1="0" x2="860" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1540" y1="0" x2="1540" y2="1080"/>
  </g>

  <!-- 顶部电影胶片条 -->
  <g opacity="0.2">
    <rect x="0" y="0" width="1920" height="100" fill="#2a2520"/>
    <rect x="45" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="145" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="245" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="345" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="445" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="545" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="645" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="745" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="845" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="945" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1045" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1145" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1245" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1345" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1445" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1545" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1645" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1745" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1845" y="22" width="50" height="56" rx="3" fill="#f3ecd9"/>
  </g>

  <!-- 底部电影胶片条 -->
  <g opacity="0.2">
    <rect x="0" y="980" width="1920" height="100" fill="#2a2520"/>
    <rect x="45" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="145" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="245" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="345" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="445" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="545" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="645" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="745" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="845" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="945" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1045" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1145" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1245" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1345" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1445" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1545" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1645" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1745" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
    <rect x="1845" y="1002" width="50" height="56" rx="3" fill="#f3ecd9"/>
  </g>

  <!-- 远处扶梯上的人物剪影（炭黑色） -->
  <g fill="#2a2520" opacity="0.22">
    <!-- 中间站立男子 -->
    <path d="M820 720 Q810 660 850 655 Q890 650 900 710 L920 820 L895 825 L880 730 L860 825 L835 820 Z"/>
    <ellipse cx="855" cy="625" rx="26" ry="30"/>
    <!-- 右侧行走女子 -->
    <path d="M1180 700 Q1170 640 1210 635 Q1250 630 1260 690 L1290 790 L1265 795 L1240 720 L1220 795 L1195 790 Z"/>
    <circle cx="1215" cy="600" r="24"/>
  </g>

  <!-- 更远处的小人 -->
  <g fill="#2a2520" opacity="0.14">
    <path d="M600 620 Q595 580 615 576 Q635 572 645 612 L660 660 L640 664 L630 620 L620 664 L600 660 Z"/>
    <circle cx="618" cy="555" r="16"/>

    <path d="M1450 640 Q1445 600 1465 596 Q1485 592 1495 632 L1510 680 L1490 684 L1480 640 L1470 684 L1450 680 Z"/>
    <circle cx="1468" cy="575" r="16"/>
  </g>

  <!-- 左侧红色人物背影（呼应原图） -->
  <g fill="#c24122" opacity="0.9" filter="url(#blur-soft)">
    <!-- 身体 -->
    <path d="M-40 1080 L80 380 Q100 340 140 340 Q180 340 200 380 L260 700 L180 720 L150 520 Q140 500 120 500 Q100 500 90 520 L60 1080 Z"/>
    <!-- 头部 -->
    <circle cx="140" cy="280" r="55"/>
    <!-- 耳朵/头发 -->
    <path d="M100 260 Q90 230 120 210 Q160 190 200 220 Q230 260 210 300" fill="none" stroke="#8a2a14" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 红色人物清晰轮廓层 -->
  <g fill="#d45d2a" opacity="0.95">
    <path d="M-30 1080 L85 390 Q105 350 140 350 Q175 350 195 390 L250 690 L185 705 L158 515 Q150 495 130 495 Q110 495 102 515 L75 1080 Z"/>
    <circle cx="140" cy="290" r="50"/>
  </g>

  <!-- 扶手/扶梯黑色粗线条 -->
  <g stroke="#1a1410" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M-20 780 L1920 220"/>
    <path d="M-20 840 L1920 280"/>
  </g>
  <g stroke="#1a1410" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M200 1080 L720 240"/>
    <path d="M480 1080 L1000 240"/>
    <path d="M760 1080 L1280 240"/>
    <path d="M1040 1080 L1560 240"/>
    <path d="M1320 1080 L1840 240"/>
  </g>

  <!-- 手绘装饰线条 -->
  <g stroke="#2a2520" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.12">
    <path d="M150 450 Q350 430 550 470"/>
    <path d="M1400 380 Q1600 360 1800 400"/>
    <path d="M200 250 Q450 270 700 240"/>
    <path d="M1100 280 Q1350 300 1600 270"/>
  </g>

  <!-- 散落的胶片感圆点 -->
  <g fill="#2a2520" opacity="0.1">
    <circle cx="250" cy="350" r="7"/>
    <circle cx="1700" cy="450" r="9"/>
    <circle cx="1550" cy="300" r="5"/>
    <circle cx="420" cy="550" r="8"/>
    <circle cx="1100" cy="520" r="6"/>
    <circle cx="850" cy="200" r="5"/>
  </g>
</svg>
